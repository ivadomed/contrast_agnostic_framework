# totalseg-pelvic CT-trained models — per-modality results table (own-contrast +
# cross-contrast). 10 pelvic/hip labels pooled into the "all" column by the shared
# aggregator (no contrast_groups pooling needed — single coherent anatomical region, not
# a multi-organ table like chaos's).
#
# ⚠️ TEMPLATE — RUN_IDs below are placeholders. Fill in the real RUN_ID for each method
# once 04_07_run_all_ct.sh has actually produced them (each 04_0X_train_ct_*.sh prints its
# RUN_ID; DualVal produces the val000 RUN_ID directly, val100 is its materialized sibling
# — see CLAUDE.md's DualVal note, both from the SAME run).
title: "totalseg-pelvic CT-trained — cross-contrast results"
output_dir: "${METRICS_ROOT}/totalseg_pelvic_model/ct"
output_prefix: "01_results"
# Our RUN_IDs are short (e.g. "ct_ours_...") and don't embed the full descriptive method
# name the way chaos's do (e.g. "chaos_t1in_auglabAug_v26_6_2_train050_val000_...") — the
# REF_SUBSTR auto-detection can't match, so sig_ref is set explicitly (per CLAUDE.md's own
# override instructions for exactly this case).
sig_ref: ct_ours_20260916_072434
column_order: [ct, mri]

sources:
  - metrics_dir: "${METRICS_ROOT}/totalseg_pelvic_model/ct"

# NOTE 2026-09-16: `runs:` here is a LIST of real full RUN_ID strings (the schema
# aggregate_from_config.py/significance_from_config.py actually expect — confirmed against
# chaos's real configs), NOT the {method: run_id} dict schema combined_modality_summary.py
# uses. auglabAug_v26_6_2_train050_val100 intentionally omitted for now — the DualVal
# trainer's val100 checkpoint mirror needs its own dedicated predict pass
# (05_08_predict_ct_auglabAug_v26_6_2_val100.sh), which hasn't been run yet.
runs:
  - ct_baseline_20260916_072434
  - ct_auglab_default_20260916_072434
  - ct_synthseg_noEM_20260916_072434
  - ct_synthseg_EM_20260916_072434
  - ct_srcsm_20260916_072434
  - ct_ours_20260916_072434
  - ct_baseline_kmeans_20260916_072434
  - ct_baseline_kmeans_label_remap_20260916_072434
  - ct_baseline_kmeans_label_remap_voronoi_20260916_072434
  - ct_v26_6_2_train050_val100_20260916_072434
