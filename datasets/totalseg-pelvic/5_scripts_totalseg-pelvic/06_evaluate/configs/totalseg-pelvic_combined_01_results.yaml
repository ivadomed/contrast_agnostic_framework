# totalseg-pelvic — combined training modalities (CT + MRI pooled), the shape the
# cross-DATASET meta_task_heatmap consumes (scripts/evaluate/meta_task_heatmap.yaml), same
# pattern as chaos_combined_01_results.yaml / autopet_combined_01_results.yaml (two real
# training modalities, pooled 3+3 folds = one equally-weighted 6-fold mean per method via
# cross_fold_class_mean).
#
# ⚠️ TEMPLATE — fill in real RUN_IDs in totalseg-pelvic_ct_01_results.yaml /
# totalseg-pelvic_mri_01_results.yaml first; this config reads the SAME run ids via the
# `runs:` map per modality below (kept in sync by hand for now, same as autopet's).
title: "totalseg-pelvic — combined (CT + MRI training modalities) results"
output_dir: "${METRICS_ROOT}/totalseg_pelvic_model/combined_contrasts"
output_prefix: "01_results"
ref: auglabAug_v26_6_2_train050_val000
column_order: [ct, mri]

modalities:
  - name: ct
    sources:
      - metrics_dir: "${METRICS_ROOT}/totalseg_pelvic_model/ct"
    runs:
      baseline: ct_baseline_20260916_072434
      auglab_default: ct_auglab_default_20260916_072434
      synthseg_noEM: ct_synthseg_noEM_20260916_072434
      synthseg_EM: ct_synthseg_EM_20260916_072434
      srcsm: ct_srcsm_20260916_072434
      auglabAug_v26_6_2_train050_val000: ct_ours_20260916_072434
      baseline_kmeans: ct_baseline_kmeans_20260916_072434
      baseline_kmeans_label_remap: ct_baseline_kmeans_label_remap_20260916_072434
      baseline_kmeans_label_remap_voronoi: ct_baseline_kmeans_label_remap_voronoi_20260916_072434
      v26_6_2_train050_val100: ct_v26_6_2_train050_val100_20260916_072434
  - name: mri
    sources:
      - metrics_dir: "${METRICS_ROOT}/totalseg_pelvic_model/mri"
    runs:
      baseline: mri_baseline_20260916_072453
      auglab_default: mri_auglab_default_20260916_072453
      synthseg_noEM: mri_synthseg_noEM_20260916_072453
      synthseg_EM: mri_synthseg_EM_20260916_072453
      srcsm: mri_srcsm_20260916_072453
      auglabAug_v26_6_2_train050_val000: mri_ours_20260916_072453
      baseline_kmeans: mri_baseline_kmeans_20260916_072453
      baseline_kmeans_label_remap: mri_baseline_kmeans_label_remap_20260916_072453
      baseline_kmeans_label_remap_voronoi: mri_baseline_kmeans_label_remap_voronoi_20260916_072453
      v26_6_2_train050_val100: mri_v26_6_2_train050_val100_20260916_072453
