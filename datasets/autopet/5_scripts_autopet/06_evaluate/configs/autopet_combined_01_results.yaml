# AutoPET — combined training modalities (CT + PET pooled), the shape the cross-DATASET
# meta_task_heatmap consumes (scripts/evaluate/meta_task_heatmap.yaml), same pattern as
# chaos_combined_01_results.yaml (two real training modalities, pooled 3+3 folds = one
# equally-weighted 6-fold mean per method via cross_fold_class_mean).
#
# Column order puts the two IN-DOMAIN (own FDG cohort) contrasts first, then the
# cross-institution/cross-tracer PSMA columns — psma_ct/psma_pet are genuine OOD
# (different institution, different tracer chemistry, different disease) unlike
# CHAOS's amos/sliver07 columns (different dataset, same organs) — see
# project_pet_task_candidate_research memory for why this label is still comparable.
#
# ⚠️ TEMPLATE — fill in real RUN_IDs in autopet_ct_01_results.yaml / autopet_pet_01_results.yaml
# first; this config reads the SAME run ids via the `runs:` map per modality below (kept
# in sync by hand for now — regenerate both together, same as toothfairy2's
# 06_04_write_configs.py does if this needs automating later).
title: "AutoPET — combined (CT + PET training modalities), cross-institution results"
output_dir: "${METRICS_ROOT}/autopet_model/combined_contrasts"
output_prefix: "01_results"
ref: auglabAug_v26_6_2_train050_val000
column_order: [ct, pet, psma_ct, psma_pet]

modalities:
  - name: ct
    sources:
      - metrics_dir: "${METRICS_ROOT}/autopet_model/ct"
    runs:
      baseline: TODO_autopet_ct_baseline_<TS>
      auglab_default: TODO_autopet_ct_auglab_default_<TS>
      synthseg_noEM: TODO_autopet_ct_synthseg_noEM_<TS>
      synthseg_EM: TODO_autopet_ct_synthseg_EM_<TS>
      srcsm: TODO_autopet_ct_srcsm_<TS>
      auglabAug_v26_6_2_train050_val000: TODO_autopet_ct_auglabAug_v26_6_2_train050_val000_<TS>
      auglabAug_v26_6_2_train050_val100: TODO_autopet_ct_auglabAug_v26_6_2_train050_val100_<TS>
  - name: pet
    sources:
      - metrics_dir: "${METRICS_ROOT}/autopet_model/pet"
    runs:
      baseline: TODO_autopet_pet_baseline_<TS>
      auglab_default: TODO_autopet_pet_auglab_default_<TS>
      synthseg_noEM: TODO_autopet_pet_synthseg_noEM_<TS>
      synthseg_EM: TODO_autopet_pet_synthseg_EM_<TS>
      srcsm: TODO_autopet_pet_srcsm_<TS>
      auglabAug_v26_6_2_train050_val000: TODO_autopet_pet_auglabAug_v26_6_2_train050_val000_<TS>
      auglabAug_v26_6_2_train050_val100: TODO_autopet_pet_auglabAug_v26_6_2_train050_val100_<TS>
