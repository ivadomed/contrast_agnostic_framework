name: mslesseg
role: test-only                 # evaluates foreign (open-ms) models; never trained on
source: "MSLesSeg (Guarnera/Rondinella et al., Univ. of Catania) -- figshare 10.6084/m9.figshare.27919209.v1"
license: CC-BY-4.0
n_scans: 115                    # 93 train-split timepoints + 22 test-split scans, collapsed into ONE pool
modalities:
  flair: {suffix: FLAIR}
  t1w:   {suffix: T1w}
  t2w:   {suffix: T2w}
orientation: LPS                 # reoriented from source LAS by 03_preprocess/03_00_reorient_to_lps.py
space: "1mm-iso MNI152 (182,218,182), co-registered to FLAIR, skull-stripped (as shipped)"
labels: {background: 0, lesion: 1}
evaluated_with:
  source_dataset: open-ms
  model_type: open_ms_model
  training_contrast: flair       # open-ms trains a SINGLE model (FLAIR only)
  test_contrasts: [flair, t1w, t2w]
