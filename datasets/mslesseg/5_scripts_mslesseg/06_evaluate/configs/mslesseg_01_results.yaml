# mslesseg — open-ms FLAIR-trained models evaluated cross-dataset on ALL 115 MSLesSeg
# scans (independent MS-lesion cohort/scanner set; archive train+test split collapsed
# into one eval-only pool — see datasets/mslesseg/README.md "Why no split").
# Same 6-method headline suite as open-ms's own 01_results.yaml (minus srcsm/ablation
# arms — those are open-ms-internal ablations, not part of the fixed 6-method suite).
# Eval (06_01) writes fold*/eval_all.csv under metrics_dir/{category}_{run_id}/.
title: "mslesseg <- open-ms FLAIR models, cross-dataset generalization (6-method suite)"
metrics_dir: "${METRICS_ROOT}/open_ms_model/flair"
output_prefix: "01_results"
in_domain_contrast: flair
column_order: [flair, t1w, t2w]

runs:
  - open-ms_flair_baseline_20260706_061243
  - open-ms_flair_auglab_default_20260706_061243
  - open-ms_flair_synthseg_noEM_train100_val000_20260706_061243
  - open-ms_flair_synthseg_EM_train100_val000_20260706_061243
  - open-ms_flair_v26_6_2_train050_val100_20260706_061243
  - open-ms_flair_auglabAug_v26_6_2_train025_val100_20260706_061243
