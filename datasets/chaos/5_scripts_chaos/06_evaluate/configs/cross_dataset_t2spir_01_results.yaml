title: "CHAOS T2spir models — cross-dataset results"
in_domain_contrast: chaos_t2spir
output_prefix: "04_01_cross_dataset_t2spir"
output_dir: "${PROJECT_ROOT}/datasets/chaos/8_results_chaos/02_metrics/chaos_model/t2spir"

column_order:
  - chaos_t2spir
  - chaos_t1in
  - chaos_t1out
  - chaos_ct_liver
  - amos_ct
  - amos_mri
  - sliver07_ct_liver

sources:
  # kidney-t2w EXCLUDED 2026-08-01: coronal acquisition, its through-plane
  # (A-P depth) FOV is fundamentally different from chaos's axial slab, so it is
  # not a valid cross-CONTRAST comparison. See datasets/kidney-t2w/ACQUISITION_PLANE_INVESTIGATION.md
  # cirrmri-liver EXCLUDED 2026-08-01: several cases show organ predictions
  # (liver/kidney/spleen all fragmented, mislabeled, kidneys missing) that are
  # NOT explained by any pipeline mechanism -- FOV, orientation, intensity/
  # normalization, trainer-class inference code, patch-tiling, config override,
  # and resampling/interpolation (tested directly: manually pre-resampled a bad
  # case with nnU-Net's own resample fn, reducing on-the-fly resampling to a
  # no-op -- fragmentation persisted unchanged) were all ruled out with direct
  # evidence. Leading explanation: cirrhosis (this cohort's diagnosis, confirmed
  # via Radiological Evaluation metadata, Mild/Moderate/Severe) causes portal
  # hypertension -> splenomegaly (spleen approaching liver size) -- an ANATOMICAL
  # distortion no augmentation strategy here randomizes (all of them randomize
  # appearance/contrast, not organ size/shape), so it isn't reliably measuring
  # contrast generalization for this dataset. Not confirmed by direct
  # measurement (this dataset's own GT is liver-only, no spleen/kidney label to
  # check against) -- treated as untrustworthy pending that confirmation.
  # msd-spleen EXCLUDED 2026-08-29: forgotten exclusion caught during a paper
  # results-aggregation review -- was never meant to be in this project's
  # cross-dataset roster. Removed here and from chaos_combined_01_results.yaml.
  - metrics_dir: "${PROJECT_ROOT}/datasets/chaos/8_results_chaos/02_metrics/chaos_model/t2spir"
    column_prefix: "chaos_"
    column_rename:
      ct: chaos_ct_liver     # chaos CT GT only has liver
  - metrics_dir: "${PROJECT_ROOT}/datasets/amos/8_results_amos/02_metrics/chaos_model/t2spir"
    column_prefix: "amos_"
  - metrics_dir: "${PROJECT_ROOT}/datasets/sliver07/8_results_sliver07/02_metrics/chaos_model/t2spir"
    column_rename:
      ct: sliver07_ct_liver  # sliver07 GT only has liver
  # NOTE: TRUSTED intentionally NOT included here — its US eval is confounded by a
  # center-bias artifact (see the t1in config note). Excluded from the roll-up.

# Significance-testing pooling (significance_from_config.py only -- see the same
# block in cross_dataset_t1in_01_results.yaml for the full rationale). Pools CT's 3
# columns (chaos_ct_liver, amos_ct, sliver07_ct_liver) into ONE top-level "CT" vote
# via per-organ-then-cross-organ averaging, instead of outvoting t1in/t1out/amos_mri
# 3-to-1. Disable by removing this block or setting use_contrast_groups: false.
contrast_groups:
  chaos_t2spir: chaos_t2spir
  chaos_t1in: chaos_t1in
  chaos_t1out: chaos_t1out
  amos_mri: amos_mri
  CT:
    liver:
      - chaos_ct_liver
      - {column: amos_ct, label: liver}
      - sliver07_ct_liver
    spleen: {column: amos_ct, label: spleen}
    kidney:
      - {column: amos_ct, label: left_kidney}
      - {column: amos_ct, label: right_kidney}

# Canonical method order (CLAUDE.md): baseline, auglab_default, synthseg_noEM,
# synthseg_EM, v26_6_2 (alone), srcsm (7th arm), OURS val000, OURS val100.
# Updated 2026-07-29: OURS was pointing at the stale pre-dual-val
# train025_val100 checkpoint -- now the current train050_val000/val100 pair.
runs:
  - chaos_t2spir_baseline_20260620_111146
  - chaos_t2spir_auglab_default_20260620_112240
  - chaos_t2spir_synthseg_noEM_20260620_112515
  - chaos_t2spir_synthseg_EM_20260620_112357
  - chaos_t2spir_srcsm_20260709_121945
  - chaos_t2spir_auglabAug_v26_6_2_train050_val000_20260710_054202
  - chaos_t2spir_auglabAug_v26_6_2_train050_val100_20260723_194053
