# Generated as part of the checkpoint_best vs checkpoint_final comparison sweep.
# Real data for the side that wasn't this dataset's historical on-disk default
# lives under metrics_dir/checkpoint_comparison/ (keys below are prefixed accordingly); the
# other side is the pre-existing headline data, untouched, in metrics_dir itself.
# auglabAug_v26_6_2's val000/val100 DualVal mirrors have genuinely different
# checkpoint_best.pth so both are kept as separate best rows; checkpoint_final.pth
# is byte-identical between them (verified via md5sum), so there is one final row.
title: "BraTS 2024 Glioma T2w — checkpoint_final"
metrics_dir: "${METRICS_ROOT}/brats2024_glioma_model/t2w"
output_prefix: "final_ckpt"
in_domain_contrast: t2w

runs:
  - checkpoint_comparison/nnUNet_brats2024-glioma_t2w_baseline_20260620_125115  # baseline
  - checkpoint_comparison/auglab_brats2024-glioma_t2w_synthseg_noEM_20260620_125442  # synthseg_noEM
  - checkpoint_comparison/auglab_brats2024-glioma_t2w_synthseg_EM_20260620_125354  # synthseg_EM
  - checkpoint_comparison/auglab_brats2024-glioma_t2w_auglab_default_20260620_125306  # auglab_default
  - checkpoint_comparison/auglab_brats2024-glioma_t2w_srcsm_20260709_122045  # srcsm
  - checkpoint_comparison/auglab_brats2024-glioma_t2w_auglabAug_v26_6_2_train050_20260725_113540  # auglabAug_v26_6_2
