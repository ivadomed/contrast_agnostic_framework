# picai-prostate T2W-trained models — headline 7-arm table (Dice + HD95), scored on the
# 55-study held-out test set in all three contrasts (in-domain t2w + cross-contrast).
#
# 7 arms from 6 training runs: the last two rows are the val000 / val100 checkpoints that
# the SINGLE DualVal run emits (see 04_train/04_06's header) — ..._val100 is a hard-linked
# mirror of the same run, not a separate training.
#
# The inline `sig. vs ref` column is auto-wired: the run list contains a run id matching
# REF_SUBSTR "auglabAug_v26_6_2_train050_val000", so aggregate_from_config.py adds it with
# no config field needed (CLAUDE.md "Inline sig. vs ref column").
#
# Consumed by 06_10_aggregate_from_config.sh AND 06_11_significance_from_config.sh.
title: "picai-prostate T2W models — csPCa lesion segmentation, cross-contrast"
in_domain_contrast: t2w
output_prefix: "01_results"
output_dir: "${METRICS_ROOT}/picai_prostate_model/t2w"
metrics_dir: "${METRICS_ROOT}/picai_prostate_model/t2w"

column_order:
  - t2w
  - adc
  - hbv

runs:
  - picai-prostate_t2w_baseline_20260802_205711
  - picai-prostate_t2w_auglab_default_20260802_205711
  - picai-prostate_t2w_synthseg_noEM_20260802_205717
  - picai-prostate_t2w_synthseg_EM_20260802_205717
  - picai-prostate_t2w_srcsm_20260802_205723
  - picai-prostate_t2w_auglabAug_v26_6_2_train050_val000_20260802_205723
  - picai-prostate_t2w_auglabAug_v26_6_2_train050_val100_20260802_205723
