name: picai-prostate
role: training
source: "PI-CAI Challenge public training/development set (Saha et al. 2022) -- Zenodo 6624726, CC-BY-NC-4.0; human-expert csPCa lesion delineations from github.com/DIAGNijmegen/picai_labels"
task: "clinically significant prostate cancer (csPCa) LESION segmentation -- intra-tissue, texture-defined target with no visible interface (see README.md)"
n_studies_source: 1500
n_studies_kept: 219      # csPCa-positive AND human-expert annotated; see README case-selection table
n_patients_kept: 219
excluded:
  csPCa_negative: 1075          # all-zero mask -> per-case Dice undefined
  ai_annotated_only: 205        # positive but no human-expert delineation (Bosma22a AI labels unused)
  lesion_outside_grid: 1
modalities:
  t2w: {suffix: T2w, role: training-modality-1, nnunet_dataset: Dataset080_PICAI_T2W}
  adc: {suffix: ADC, role: training-modality-2, nnunet_dataset: Dataset081_PICAI_ADC}
  hbv: {suffix: HBV, role: test-only}
space: "256x256x24, 0.5x0.5x3.0mm -- ONE common grid per study, prostate-centred; all three contrasts + label share byte-identical affines (resampled by 00_utils/00_01_bidsify.py)"
grid_rationale: "matches PI-CAI's own picai_prep baseline geometry (matrix_size=[20,256,256], spacing=[3.0,0.5,0.5]), widened 20->24 slices"
labels: {background: 0, lesion: 1}   # PI-CAI encodes one integer per distinct lesion; binarised at bidsify
splits:
  level: patient
  n_test_patients: 55
  n_train_pool_patients: 164
  test_selection: "stratified by lesion burden (evenly spaced ranks of total lesion volume)"
  n_folds_file: 4
  n_folds_trained: 3       # folds 0 1 2 only -- CLAUDE.md FOLD POLICY
training:
  epochs: 2000
  methods: [baseline, auglab_default, synthseg_noEM, synthseg_EM, srcsm, auglabAug_v26_6_2_train050_val000]
  arms_produced: 7         # the 6th method is DualVal -> emits both _val000 and _val100
  test_contrasts: [t2w, adc, hbv]
cluster_paths:
  tamia: "bulk data on $SCRATCH via scripts/cluster/tamia_env_picai.sh (its /project is at its file-COUNT quota); splits stay in the repo"
