# open-ms — FLAIR-trained models, cross-contrast (texture-advantage experiment).
# STANDARD layout (same as chaos/on-harmony): consumed by the shared aggregator
# scripts/evaluate/aggregate_from_config.py via 06_10_aggregate_from_config.sh, and
# by the companion significance_from_config.py via 06_11_significance_from_config.sh
# (same config, run separately — pass --ref explicitly there, see 06_11's header:
# the "auglabAug"+"v26_6_2" auto-pick would otherwise match other ablation runs that
# extend the same run id, e.g. the train050_val000 arm below).
# Eval (06_01) writes fold*/eval_all.csv under metrics_dir/{category}_{run_id}/.
title: "open-ms — FLAIR-trained models, cross-contrast (7-method incl. srcsm)"
metrics_dir: "${METRICS_ROOT}/open_ms_model/flair"
output_prefix: "01_results"
in_domain_contrast: flair

# Fixed 7-method order (no others): baseline, synthseg_noEM, synthseg_EM,
# auglab_default, srcsm, auglabAug_v26_6_2 train050_val000, then train050_val100.
# v26_6_2-alone and the train025_val100 auglabAug variant live in the ablation
# configs (02_ablation*), not here. A run with no eval data yet still gets a row
# (blank/"—") rather than being dropped, so the method list/order stays fixed.
runs:
  - open-ms_flair_baseline_20260706_061243
  - open-ms_flair_synthseg_noEM_train100_val000_20260706_061243
  - open-ms_flair_synthseg_EM_train100_val000_20260706_061243
  - open-ms_flair_auglab_default_20260706_061243
  - open-ms_flair_srcsm_20260709_072043
  - open-ms_flair_auglabAug_v26_6_2_train050_val000_20260710_054455
  - open-ms_flair_auglabAug_v26_6_2_train050_val100_20260716_095413
