# Generated as part of the checkpoint_best vs checkpoint_final comparison sweep.
# Real data for the side that wasn't this dataset's historical on-disk default
# lives under metrics_dir/checkpoint_comparison/ (keys below are prefixed accordingly); the
# other side is the pre-existing headline data, untouched, in metrics_dir itself.
# auglabAug_v26_6_2's val000/val100 DualVal mirrors have genuinely different
# checkpoint_best.pth so both are kept as separate best rows; checkpoint_final.pth
# is byte-identical between them (verified via md5sum), so there is one final row.
title: "open-ms FLAIR — checkpoint_best vs checkpoint_final"
metrics_dir: "${METRICS_ROOT}/open_ms_model/flair"
output_prefix: "best_vs_final_ckpt"
in_domain_contrast: flair

runs:
  - nnUNet_open-ms_flair_baseline_20260706_061243  # baseline (best)
  - checkpoint_comparison/nnUNet_open-ms_flair_baseline_20260706_061243  # baseline (final)
  - auglab_open-ms_flair_synthseg_noEM_train100_val000_20260706_061243  # synthseg_noEM (best)
  - checkpoint_comparison/auglab_open-ms_flair_synthseg_noEM_train100_val000_20260706_061243  # synthseg_noEM (final)
  - auglab_open-ms_flair_synthseg_EM_train100_val000_20260706_061243  # synthseg_EM (best)
  - checkpoint_comparison/auglab_open-ms_flair_synthseg_EM_train100_val000_20260706_061243  # synthseg_EM (final)
  - auglab_open-ms_flair_auglab_default_20260706_061243  # auglab_default (best)
  - checkpoint_comparison/auglab_open-ms_flair_auglab_default_20260706_061243  # auglab_default (final)
  - auglab_open-ms_flair_srcsm_20260709_072043  # srcsm (best)
  - checkpoint_comparison/auglab_open-ms_flair_srcsm_20260709_072043  # srcsm (final)
  - auglab_open-ms_flair_auglabAug_v26_6_2_train050_val000_20260710_054455  # auglabAug_v26_6_2 val000 (best)
  - auglab_open-ms_flair_auglabAug_v26_6_2_train050_val100_20260716_095413  # auglabAug_v26_6_2 val100 (best)
  - checkpoint_comparison/auglab_open-ms_flair_auglabAug_v26_6_2_train050_20260716_095413  # auglabAug_v26_6_2 (final)
