# open-ms — FLAIR-trained, auglab-anchored causal-ablation ladder, @ train050_val000
# (unified train probability — bumped from the branch's usual 25% to match the
# baseline-anchored branch — + clean, real-image validation via
# nnUNetTrainerOpenMSAugLabDefault instead of the val-synth trainers). Same
# ladder as open-ms_flair_02_ablation_auglab_val100.yaml, just at the
# train050_val000 setting. Floor (auglab_default) is reused unchanged — it has
# no synthesis, so no train/val ratio applies to it. One of 4 parallel branches
# (baseline/auglab x val100/val000) — see
# open-ms_flair_02_ablation_{baseline_val100,auglab_val100,baseline_val000}.yaml.
# NOTE (2026-07-11): auglab_kmeans_train050_val000 folds 1-2 are still
# training as of this config's creation — 06_10/06_11 will skip it with a
# warning until its eval_all.csv exists, then pick it up automatically.
# Same eval_all.csv sources as 01_results.yaml (06_01). Consumed by 06_10
# (aggregate_from_config.py) and 06_11 (significance_from_config.py, same
# config, pass --ref explicitly — see that script's header for the
# substring-ambiguity gotcha).
title: "open-ms — FLAIR-trained, auglab-anchored causal-ablation ladder @ train050_val000 (PALETTE mechanism decomposition)"
sources:
  - metrics_dir: "${METRICS_ROOT}/open_ms_model/flair"
    column_prefix: ""
output_dir: "${METRICS_ROOT}/open_ms_model/flair/ablations"
output_prefix: "auglab_val000"
in_domain_contrast: flair
column_order: [flair, t2w, t1w]

runs:
  - open-ms_flair_auglab_default_20260706_061243
  - ablations/auglab_open-ms_flair_auglab_kmeans_train050_val000_20260711_065618
  - ablations/auglab_open-ms_flair_auglab_kmeans_label_remap_train050_val000_20260711_063123
  - ablations/auglab_open-ms_flair_auglab_kmeans_label_remap_voronoi_train050_val000_20260711_063200
  - open-ms_flair_auglabAug_v26_6_2_train050_val000_20260710_054455
