# open-ms T1w-TRAINED models -- combined cross-dataset results: open-ms's own
# held-out test set (in-domain t1w + cross-contrast flair/t2w) AND mslesseg's
# independent 115-scan cohort. Same shape as cross_dataset_flair_01_results.yaml
# (open-ms's other training contrast) -- see that file's header for the full
# rationale. Consumed by 06_10_aggregate_from_config.sh AND
# 06_11_significance_from_config.sh (same config, run separately).
title: "open-ms T1w-TRAINED models -- own test set + mslesseg cross-dataset generalization"
in_domain_contrast: open-ms_t1w
output_prefix: "04_01_cross_dataset_t1w"
output_dir: "${PROJECT_ROOT}/datasets/open-ms/8_results_open-ms/02_metrics/open_ms_model/t1w"

column_order:
  - open-ms_flair
  - open-ms_t1w
  - open-ms_t2w
  - mslesseg_flair
  - mslesseg_t1w
  - mslesseg_t2w

sources:
  - metrics_dir: "${PROJECT_ROOT}/datasets/open-ms/8_results_open-ms/02_metrics/open_ms_model/t1w"
    column_prefix: "open-ms_"
  - metrics_dir: "${PROJECT_ROOT}/datasets/mslesseg/8_results_mslesseg/02_metrics/open_ms_model/t1w"
    column_prefix: "mslesseg_"

# Fixed 6-method suite (CLAUDE.md canonical order), T1w-TRAINED checkpoints.
# Same RUN_IDs as datasets/mslesseg/.../configs/mslesseg_t1w_01_results.yaml
# (mslesseg evaluates these exact open-ms checkpoints) -- kept in sync by hand.
runs:
  - open-ms_t1w_baseline_20260708_083441
  - open-ms_t1w_auglab_default_20260708_083511
  - open-ms_t1w_synthseg_noEM_train100_val000_20260708_083541
  - open-ms_t1w_synthseg_EM_train100_val000_20260708_083611
  - open-ms_t1w_v26_6_2_train050_val100_20260708_083641
  - open-ms_t1w_auglabAug_v26_6_2_train025_val100_20260708_083711
