# open-ms T1w-TRAINED models -- own test set (in-domain t1w + cross-contrast
# flair/t2w). Both external cross-dataset sources this file used to also
# report are now excluded by explicit editorial decision, most recently
# mslesseg (2026-08-29: isolate the cross-MODALITY effect without an entangled
# cross-dataset annotation-style confound; see open-ms_combined_01_results.yaml's
# comment for the full rationale) and earlier ms3seg (same reasoning class).
# Both datasets have been archived to datasets/03_archive/. Same shape as
# cross_dataset_flair_01_results.yaml (open-ms's other training contrast) --
# see that file's header for the full rationale. Consumed by
# 06_10_aggregate_from_config.sh AND 06_11_significance_from_config.sh (same
# config, run separately).
title: "open-ms T1w-TRAINED models -- own test set (no external cross-dataset source currently)"
in_domain_contrast: open-ms_t1w
output_prefix: "04_01_cross_dataset_t1w"
output_dir: "${PROJECT_ROOT}/datasets/open-ms/8_results_open-ms/02_metrics/open_ms_model/t1w"

column_order:
  - open-ms_flair
  - open-ms_t1w
  - open-ms_t2w

sources:
  - metrics_dir: "${PROJECT_ROOT}/datasets/open-ms/8_results_open-ms/02_metrics/open_ms_model/t1w"
    column_prefix: "open-ms_"

# 8-method suite (CLAUDE.md canonical order + srcsm 7th arm), T1w-TRAINED checkpoints.
# OURS is the current val000/val100 pair.
runs:
  - open-ms_t1w_baseline_20260708_083441
  - open-ms_t1w_auglab_default_20260708_083511
  - open-ms_t1w_synthseg_noEM_train100_val000_20260708_083541
  - open-ms_t1w_synthseg_EM_train100_val000_20260708_083611
  - open-ms_t1w_v26_6_2_train050_val100_20260708_083641
  - open-ms_t1w_srcsm_20260709_075121
  - open-ms_t1w_auglabAug_v26_6_2_train050_val000_20260710_054525
  - open-ms_t1w_auglabAug_v26_6_2_train050_val100_20260723_194125
