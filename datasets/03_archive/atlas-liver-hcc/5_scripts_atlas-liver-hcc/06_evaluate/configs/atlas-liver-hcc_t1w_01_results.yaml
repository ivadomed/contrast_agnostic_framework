# atlas-liver-hcc — T1w-trained models, 6-method suite, folds 0 1 2.
# STANDARD layout: consumed by 06_10_aggregate_from_config.sh (aggregate) and
# 06_11_significance_from_config.sh (paired significance; pass --ref explicitly).
# Eval (06_01) writes fold*/eval_all.csv under metrics_dir/{category}_{run_id}/.
#
# SINGLE-MODALITY DATASET: unlike chaos/brats2024-glioma/on-harmony/open-ms (each
# trained on 2 modalities, pooled via combined_modality_summary.py), atlas-liver-hcc has
# exactly ONE training contrast (T1w CE-MRI) — there is no second modality to pool, so
# this dataset does NOT get a combined_contrasts/ table. The `all` column here already
# IS the full headline result (mean over the single "t1w" test item x 12 held-out
# patients x 3 folds); the held-out-patient split is the generalization axis, not a
# cross-contrast one. Do not wire a fake combined_contrasts step for this dataset.
title: "atlas-liver-hcc — T1w-trained models (6-method suite, single modality)"
metrics_dir: "${METRICS_ROOT}/atlas_liver_hcc_model/t1w"
output_prefix: "01_results"
in_domain_contrast: t1w

# Fixed 6-method order + DualVal's val100 mirror as a 7th row: baseline, auglab_default,
# synthseg_noEM, synthseg_EM, srcsm, auglabAug_v26_6_2 train050_val000 (OURS, ref),
# train050_val100. checkpoint_best_val000.pth and checkpoint_best_val100.pth are
# genuinely different snapshots (confirmed by diffing eval_all.csv: different per-case
# Dice, not a duplicate) -- same 2-row pattern chaos/open-ms's headline configs already
# use. (Corrected 2026-08-29: this file previously omitted val100 as "not the headline",
# reasoning from the checkpoint_final.pth collapse case, which doesn't apply at
# checkpoint_best -- val100's predict+evaluate had already completed, just never wired
# into this config.)
#
# Filled in 2026-08-06 after the TamIA suite (launched 2026-08-04, TS=20260804_062605)
# finished training and predict+evaluate completed via 05_20_tamia_pack_predict_evaluate.sh.
runs:
  - atlas-liver-hcc_t1w_baseline_20260804_062605
  - atlas-liver-hcc_t1w_auglab_default_20260804_062605
  - atlas-liver-hcc_t1w_synthseg_noEM_20260804_062605
  - atlas-liver-hcc_t1w_synthseg_EM_20260804_062605
  - atlas-liver-hcc_t1w_srcsm_20260804_062605
  - atlas-liver-hcc_t1w_auglabAug_v26_6_2_train050_val000_20260804_062605
  - atlas-liver-hcc_t1w_auglabAug_v26_6_2_train050_val100_20260804_062605
