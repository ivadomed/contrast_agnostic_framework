# atlas-liver-hcc T1w models — cross-dataset (cross-contrast) results.
#
# atlas-liver-hcc trains on a SINGLE modality (CE-T1w) -- unlike our other training
# datasets, it has no second in-house training contrast to cross-evaluate against, so
# its own headline config (atlas-liver-hcc_t1w_01_results.yaml) has no OOD axis at all
# (significance_from_config.py's "OOD cross-contrast generalization" section comes back
# empty on that config -- see project_atlas_liver_hcc_onboarding memory). This config
# pools in the lld-mmri-hcc eval-only cross-dataset (T2WI + DWI, real HCC lesion masks,
# genuinely different contrast mechanism -- see datasets/lld-mmri-hcc/README.md) so the
# cross-contrast robustness question can actually be answered, mirroring chaos's
# cross_dataset_{t1in,t2spir}_01_results.yaml pattern.
#
# lld-mmri-hcc scores ONLY the tumour label (no liver-organ mask in that dataset, and
# its masks are MedSAM2 semi-automated, not fully expert-drawn -- see that dataset's
# README caveat before treating a low score there as pure domain-gap evidence).
#
# Added 2026-08-29: liverhccseg (TCGA-LIHC, 14 HCC patients, real expert masks -- 2
# independent board-certified radiologist raters, rater1 used as GT). Deliberately
# genuinely HCC-only (unlike lld-mmri-hcc's broader liver-lesion pool -- adding
# non-HCC lesions was considered and rejected: it would confound cross-contrast
# generalization with cross-DISEASE generalization, a different and murkier claim).
# Same CE-T1w contrast FAMILY as ATLAS's own training data (pre/art/pv/del phases) --
# NOT a cross-contrast test the way lld-mmri-hcc's T2WI/DWI is -- but a genuinely
# independent cohort/scanner/protocol, added as an extra concordant stratum to
# strengthen the pooled significance test (motivation: OURS vs synthseg_EM was only
# p=0.11 on lld-mmri-hcc alone). liverhccseg scores tumour only too (see that
# dataset's README) so every OOD/cross-dataset column measures the same construct.
title: "atlas-liver-hcc T1w models — cross-dataset (cross-contrast) results"
# in_domain_contrast highlighting removed 2026-08-31: atlas_t1w is no longer its
# own column (see contrast_groups below) -- it's pooled into "t1w" together with
# liverhccseg's external cohort, so there's no single column left that's purely
# in-domain to highlight.
output_prefix: "04_01_cross_dataset_t1w"
output_dir: "${PROJECT_ROOT}/datasets/atlas-liver-hcc/8_results_atlas-liver-hcc/02_metrics/atlas_liver_hcc_model/t1w"

column_order:
  - atlas_t1w
  - liverhccseg_ce-pre_T1w
  - liverhccseg_ce-art_T1w
  - liverhccseg_ce-pv_T1w
  - liverhccseg_ce-del_T1w
  - lldmmrihcc_ce-pre
  - lldmmrihcc_ce-art
  - lldmmrihcc_ce-pv
  - lldmmrihcc_ce-del
  - lldmmrihcc_inphase
  - lldmmrihcc_outphase
  - lldmmrihcc_t2wi
  - lldmmrihcc_dwi

sources:
  - metrics_dir: "${PROJECT_ROOT}/datasets/atlas-liver-hcc/8_results_atlas-liver-hcc/02_metrics/atlas_liver_hcc_model/t1w"
    column_prefix: "atlas_"
  - metrics_dir: "${PROJECT_ROOT}/datasets/lld-mmri-hcc/8_results_lld-mmri-hcc/02_metrics/atlas_liver_hcc_model/t1w"
    column_prefix: "lldmmrihcc_"
  - metrics_dir: "${PROJECT_ROOT}/datasets/liverhccseg/8_results_liverhccseg/02_metrics/atlas_liver_hcc_model/t1w"
    column_prefix: "liverhccseg_"

# Column/pooling structure (aggregate_from_config.py's contrast_groups machinery
# -- feeds BOTH significance_from_config.py AND this file's own aggregate_from_
# config.py summary table's columns/heatmap; each key below is ONE DISPLAYED
# COLUMN, not a raw source). Without this, liverhccseg's 4 phase columns each
# count as an independently-weighted "contrast" in the OOD macroΔ average, so
# liverhccseg alone would outvote lld-mmri-hcc's t2wi+dwi 4-to-2 even though
# it's one dataset testing one contrast family.
#
# 2026-08-31: atlas_t1w (in-domain, same-distribution held-out test) and
# liverhccseg's 4 CE-T1w phases (external cohort/scanner, same contrast FAMILY)
# used to print as separate columns -- atlas_t1w alone, "liverhccseg_t1w" pooled
# alone -- which looked like the same unfixed problem CHAOS's CT columns had.
# Explicit call: pool them together into one "t1w" column (cases concatenated),
# matching the CT precedent exactly, even though atlas_t1w is in-domain and
# liverhccseg is a genuinely different cohort/scanner -- this trades away the
# in-domain-vs-external-cohort distinction for this column (baseline alone is
# 72.6 Dice in-domain vs 57.7 on liverhccseg, pre-merge -- a real gap, now
# blended into one number). If that distinction turns out to matter later,
# split `t1w` back into two entries instead of re-deriving this from scratch.
# t2wi/dwi stay separate from t1w and each other -- genuinely different contrasts.
# Disable by removing this block or setting use_contrast_groups: false.
#
# 2026-09-01, revised again: everything above treated all lld-mmri-hcc/liverhccseg
# CE-T1w-family evidence (art/pv/del/pre) as OOD/cross-contrast material, on par
# with t2wi/dwi/inphase/outphase. That's wrong -- ATLAS's OWN training cohort is
# itself a mix of arterial/delayed/post-contrast/pre-contrast/unknown phases (its
# curators picked whichever phase best showed the tumour per patient), so the
# model was already exposed to arterial-, delayed-, and pre-contrast CE-T1w
# during training. Testing on MORE CE-T1w phases -- even from different cohorts
# -- is a cross-COHORT test, not a cross-CONTRAST one; pooling it into the "OOD
# cross-contrast generalization" headline claim conflates two different
# questions. Only t2wi, dwi, inphase, and outphase are genuinely contrasts/
# sequences the model never saw (inphase/outphase are a native, no-contrast-
# agent T1w Dixon dual-echo acquisition -- a different pulse sequence from
# anything in ATLAS's CE-MRI protocol).
#
# Fix: merge everything CE-T1w-ish -- atlas_t1w (own) + ce_external (art/pv/del,
# still pooled-same-phase-across-sources-then-averaged internally, since HCC's
# diagnostic signature is the phase-to-phase enhancement/washout change) +
# t1w_external (ce-pre, which has NO actual enhancement despite the "ce-"
# filename prefix, but is still the same broad training-contrast family) -- into
# one `CE_T1w_all` group, and mark it `in_domain_group` so
# significance_from_config.py excludes it from the OOD headline claim (shown
# instead in the "IND in-domain" block) while `aggregate_from_config.py`'s `all`
# column and the "ALL contrasts combined" significance block still include it,
# matching how in_domain_contrast/in_domain_group already work everywhere else
# in this project. The OOD headline is now genuinely t2wi/dwi/inphase/outphase
# only -- 4 groups, equal weight, all real cross-contrast evidence.
# Disable by removing this block or setting use_contrast_groups: false.
in_domain_group: CE_T1w_all
contrast_groups:
  CE_T1w_all:
    atlas_own: atlas_t1w
    ce_external:
      art:
        - liverhccseg_ce-art_T1w
        - lldmmrihcc_ce-art
      pv:
        - liverhccseg_ce-pv_T1w
        - lldmmrihcc_ce-pv
      del:
        - liverhccseg_ce-del_T1w
        - lldmmrihcc_ce-del
    t1w_external:
      - liverhccseg_ce-pre_T1w
      - lldmmrihcc_ce-pre
  lldmmrihcc_dwi: lldmmrihcc_dwi
  lldmmrihcc_t2wi: lldmmrihcc_t2wi
  lldmmrihcc_inphase: lldmmrihcc_inphase
  lldmmrihcc_outphase: lldmmrihcc_outphase

# Same 6 headline RUN_IDs as atlas-liver-hcc_t1w_01_results.yaml, plus the
# train050_val100 DualVal mirror (added 2026-08-29 -- predict+evaluate had
# already completed on all 3 sources, just never wired into this config; see
# that file's own runs: comment for the val000-vs-val100 verification).
runs:
  - atlas-liver-hcc_t1w_baseline_20260804_062605
  - atlas-liver-hcc_t1w_auglab_default_20260804_062605
  - atlas-liver-hcc_t1w_synthseg_noEM_20260804_062605
  - atlas-liver-hcc_t1w_synthseg_EM_20260804_062605
  - atlas-liver-hcc_t1w_srcsm_20260804_062605
  - atlas-liver-hcc_t1w_auglabAug_v26_6_2_train050_val000_20260804_062605
  - atlas-liver-hcc_t1w_auglabAug_v26_6_2_train050_val100_20260804_062605
