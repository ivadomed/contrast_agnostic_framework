name: ms3seg
role: test-only
source: "MS3SEG (Bawil et al.) -- figshare 10.6084/m9.figshare.30393475.v6, CC-BY-4.0"
n_scans: 100
modalities:
  flair: {suffix: FLAIR}
  t1w:   {suffix: T1WI_reg}
  t2w:   {suffix: T2WI_reg}
orientation: LPS   # source images LAS, source combined mask RAS (mismatch!) -- both fixed by 03_preprocess
space: "256x256x20, 0.898x0.898x6.8mm (thick-slice clinical acquisition, Toshiba scanner)"
labels_raw: {background: 0, ventricles: 64, normal_WMH: 191, MS_lesion: 255}   # verified empirically, not small class indices
labels_scored: {lesion: 255}   # only MS lesion scored against open-ms's binary lesion output
evaluated_with:
  source_dataset: open-ms
  model_type: open_ms_model
  training_contrasts: [flair, t1w]
  test_contrasts: [flair, t1w, t2w]
  label_map: '{"lesion": [1, 255]}'   # pred_id (open-ms) -> gt_id (ms3seg)
