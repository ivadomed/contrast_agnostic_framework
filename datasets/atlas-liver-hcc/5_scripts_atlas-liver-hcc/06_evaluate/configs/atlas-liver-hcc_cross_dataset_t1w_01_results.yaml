# atlas-liver-hcc T1w models — cross-dataset (cross-contrast) results.
#
# atlas-liver-hcc trains on a SINGLE modality (CE-T1w) -- unlike our other training
# datasets, it has no second in-house training contrast to cross-evaluate against, so
# its own headline config (atlas-liver-hcc_t1w_01_results.yaml) has no OOD axis at all
# (significance_from_config.py's "OOD cross-contrast generalization" section comes back
# empty on that config -- see project_atlas_liver_hcc_onboarding memory). This config
# pools in the lld-mmri-hcc eval-only cross-dataset (T2WI + DWI, real HCC lesion masks,
# genuinely different contrast mechanism -- see datasets/lld-mmri-hcc/README.md) so the
# cross-contrast robustness question can actually be answered, mirroring chaos's
# cross_dataset_{t1in,t2spir}_01_results.yaml pattern.
#
# lld-mmri-hcc scores ONLY the tumour label (no liver-organ mask in that dataset, and
# its masks are MedSAM2 semi-automated, not fully expert-drawn -- see that dataset's
# README caveat before treating a low score there as pure domain-gap evidence).
title: "atlas-liver-hcc T1w models — cross-dataset (cross-contrast) results"
in_domain_contrast: atlas_t1w
output_prefix: "04_01_cross_dataset_t1w"
output_dir: "${PROJECT_ROOT}/datasets/atlas-liver-hcc/8_results_atlas-liver-hcc/02_metrics/atlas_liver_hcc_model/t1w"

column_order:
  - atlas_t1w
  - lldmmrihcc_t2wi
  - lldmmrihcc_dwi

sources:
  - metrics_dir: "${PROJECT_ROOT}/datasets/atlas-liver-hcc/8_results_atlas-liver-hcc/02_metrics/atlas_liver_hcc_model/t1w"
    column_prefix: "atlas_"
  - metrics_dir: "${PROJECT_ROOT}/datasets/lld-mmri-hcc/8_results_lld-mmri-hcc/02_metrics/atlas_liver_hcc_model/t1w"
    column_prefix: "lldmmrihcc_"

# Same 6 headline RUN_IDs as atlas-liver-hcc_t1w_01_results.yaml (TS=20260804_062605).
runs:
  - atlas-liver-hcc_t1w_baseline_20260804_062605
  - atlas-liver-hcc_t1w_auglab_default_20260804_062605
  - atlas-liver-hcc_t1w_synthseg_noEM_20260804_062605
  - atlas-liver-hcc_t1w_synthseg_EM_20260804_062605
  - atlas-liver-hcc_t1w_srcsm_20260804_062605
  - atlas-liver-hcc_t1w_auglabAug_v26_6_2_train050_val000_20260804_062605
