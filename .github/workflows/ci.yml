name: CI

on:
  push:
    branches: [main, paul/v26_6_2]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.16.10
      - name: Python syntax errors and undefined names
        run: ruff check --select E9,F63,F7,F82 --output-format github .
      - name: Python byte-compile
        run: python -m compileall -q .
      - name: Shell syntax
        run: git ls-files -z '*.sh' | xargs -0 -n1 bash -n

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU torch + test dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install pytest numpy scipy pandas pyyaml matplotlib nibabel SimpleITK pillow \
            "kornia==0.7.2" "omegaconf==2.3.0" "hydra-core==1.3.2" "monai==1.5.2"
      # Data-dependent checks skip themselves when the dataset is not on the machine.
      - run: python -m pytest tests benchmark -q
