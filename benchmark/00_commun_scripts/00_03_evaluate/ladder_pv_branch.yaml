# Rung-6 (PALETTE + boundary partial-volume) branch registry for ladder_ood_common.py.
# OPT-IN: nothing here affects any ladder unless the environment has LADDER_PV_BRANCH=1 (rung 6 is
# deliberately NOT part of the ladders -- Paul, 2026-10-05; read the difference with run_rung56_diff.sh).
# key   = the END of a ladder's ablations_root (its output dir)
# value = the rung-6 run key, resolved under every source the ladder pools, exactly like the
#         ladder's own rung keys (the engine adds the nnUNet_/auglab_ category prefix).
# A registered ladder is re-run with rungs [baseline .. rung 5, rung 6] into <ablations_root>_pv/.
# ONLY register a ladder once rung-6 metrics exist in EVERY source it pools (own contrasts AND
