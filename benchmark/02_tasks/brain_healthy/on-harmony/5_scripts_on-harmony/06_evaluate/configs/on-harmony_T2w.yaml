# ON-Harmony cross-contrast benchmark — models TRAINED on T2w, tested on every contrast.
# STANDARD layout (same as chaos): consumed by the shared aggregator
# scripts/evaluate/aggregate_from_config.py via 06_02_aggregate_from_config.sh, and by
# significance_from_config.py via 06_03_significance_from_config.sh (same config, both scripts).
# Eval (06_01) writes fold*/eval_all.csv under metrics_dir/{category}_{run_id}/.
#
# ⚠️ On-harmony's significance test is currently anti-conservative for ALL modalities
# (per-image units from 4 test subjects, not per-patient) — see project memory
# project_onharmony_significance_rerun_20260921; treat `sig. vs ref` here the same
# way as the other on-harmony tables, not as newly trustworthy.
title: "ON-Harmony — T2w-trained models, cross-contrast (incl. srcsm)"
metrics_dir: "${METRICS_ROOT}/on_harmony_model/T2w"
output_prefix: "01_results"
in_domain_contrast: T2w

# Fixed 7-method order (no others): baseline, synthseg_noEM, synthseg_EM,
# auglab_default, srcsm, auglabAug_v26_6_2 train050_val000, then train050_val100.
# v26_6_2-alone and the train025_val100 auglabAug variant are dropped from this
# table. train050_val100 has NOT been trained yet — blank row (not dropped).
runs:
  - on-harmony_T2w_baseline_20260624_191152
  - on-harmony_T2w_synthseg_noEM_20260624_191418
  - on-harmony_T2w_synthseg_EM_20260624_191329
  - on-harmony_T2w_auglab_default_20260625_143115
  - on-harmony_T2w_srcsm_20260709_122145_srcmatch
  - on-harmony_T2w_auglabAug_v26_6_2_train050_val000_20260710_040443
  - on-harmony_T2w_auglabAug_v26_6_2_train050_val100_20260727_075205
