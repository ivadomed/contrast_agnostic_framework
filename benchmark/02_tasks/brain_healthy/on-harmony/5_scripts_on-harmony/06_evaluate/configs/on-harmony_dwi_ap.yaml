# ON-Harmony — models TRAINED on dwi_ap (b~0 EPI, 3rd training modality, added
# 2026-09-21), cross-contrast. STANDARD layout (same as T1w/T2w): consumed by the
# shared aggregator via 06_02_aggregate_from_config.sh, and by significance_from_config.py
# via 06_03_significance_from_config.sh (same config, both scripts).
#
#   bash 06_02_aggregate_from_config.sh configs/on-harmony_dwi_ap.yaml
#   bash 06_03_significance_from_config.sh configs/on-harmony_dwi_ap.yaml
#
# ⚠️ dwi_ap is NOT diffusion-weighted — it is a b≈0 T2*-weighted single-shot-EPI
# readout (see 02_convert_to_nnunet/02_05_convert_dataset_dwi.py's docstring).
# ⚠️ On-harmony's significance test is currently anti-conservative for ALL modalities
# (per-image units from 4 test subjects, not per-patient) — see project memory
# project_onharmony_significance_rerun_20260921; treat `sig. vs ref` here the same
# way as the existing T1w/T2w tables, not as newly trustworthy.
title: "ON-Harmony — dwi_ap-trained models, cross-contrast"
metrics_dir: "${METRICS_ROOT}/on_harmony_model/dwi_ap"
output_prefix: "01_results"
in_domain_contrast: dwi_ap

# Fixed 7-method order (no others): baseline, synthseg_noEM, synthseg_EM,
# auglab_default, srcsm, auglabAug_v26_6_2 train050_val000, then train050_val100.
runs:
  - on-harmony_dwi_ap_baseline_20260921_203727
  - on-harmony_dwi_ap_synthseg_noEM_20260921_203727
  - on-harmony_dwi_ap_synthseg_EM_20260921_203727
  - on-harmony_dwi_ap_auglab_default_20260921_203727
  - on-harmony_dwi_ap_srcsm_20260921_203727_srcmatch
  - on-harmony_dwi_ap_auglabAug_v26_6_2_train050_val000_20260921_203727
  - on-harmony_dwi_ap_auglabAug_v26_6_2_train050_val100_20260921_203727
