# open-ms — T1w-trained models, cross-contrast (6-method suite, folds 0 1 2).
# STANDARD layout: consumed by 06_10_aggregate_from_config.sh (aggregate) and
# 06_11_significance_from_config.sh (paired Wilcoxon; pass --ref explicitly).
# Eval (06_13→06_01) writes fold*/eval_all.csv under metrics_dir/{category}_{run_id}/.
title: "open-ms — T1w-trained models, cross-contrast (7-method suite incl. srcsm)"
metrics_dir: "${METRICS_ROOT}/open_ms_model/t1w"
output_prefix: "01_results"
in_domain_contrast: t1w

# Fixed 7-method order (no others): baseline, synthseg_noEM, synthseg_EM,
# auglab_default, srcsm, auglabAug_v26_6_2 train050_val000, then train050_val100.
# v26_6_2-alone and the train025_val100 auglabAug variant are dropped from this
# table (they live elsewhere / aren't part of this fixed comparison). The
# train050_val100 run is still training as of 2026-07-23 — it gets a blank row
# (not dropped) until its eval_all.csv exists.
runs:
  - open-ms_t1w_baseline_20260708_083441
  - open-ms_t1w_synthseg_noEM_train100_val000_20260708_083541
  - open-ms_t1w_synthseg_EM_train100_val000_20260708_083611
  - open-ms_t1w_auglab_default_20260708_083511
  - open-ms_t1w_srcsm_20260709_075121
  - open-ms_t1w_auglabAug_v26_6_2_train050_val000_20260710_054525
  - open-ms_t1w_auglabAug_v26_6_2_train050_val100_20260723_194125
