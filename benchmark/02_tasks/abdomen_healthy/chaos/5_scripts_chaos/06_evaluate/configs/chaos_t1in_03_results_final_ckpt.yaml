# Generated as part of the checkpoint_best vs checkpoint_final comparison sweep.
# Real data for the side that wasn't this dataset's historical on-disk default
# lives under metrics_dir/checkpoint_comparison/ (keys below are prefixed accordingly); the
# other side is the pre-existing headline data, untouched, in metrics_dir itself.
# auglabAug_v26_6_2's val000/val100 DualVal mirrors have genuinely different
# checkpoint_best.pth so both are kept as separate best rows; checkpoint_final.pth
# is byte-identical between them (verified via md5sum), so there is one final row.
title: "CHAOS T1in — checkpoint_final"
metrics_dir: "${METRICS_ROOT}/chaos_model/t1in"
output_prefix: "final_ckpt"
in_domain_contrast: t1in

runs:
  - checkpoint_comparison/nnUNet_chaos_t1in_baseline_20260614_153230  # baseline
  - checkpoint_comparison/auglab_chaos_t1in_synthseg_noEM_train100_val000_20260611_120000  # synthseg_noEM
  - checkpoint_comparison/auglab_chaos_t1in_synthseg_EM_train100_val000_20260611_120000  # synthseg_EM
  - checkpoint_comparison/auglab_chaos_t1in_auglab_default_20260611_120000  # auglab_default
  - checkpoint_comparison/auglab_chaos_t1in_srcsm_20260710_011817  # srcsm
  - checkpoint_comparison/auglab_chaos_t1in_auglabAug_v26_6_2_train050_20260616_112420  # auglabAug_v26_6_2
