# Generated as part of the checkpoint_best vs checkpoint_final comparison sweep.
# Real data for the side that wasn't this dataset's historical on-disk default
# lives under metrics_dir/checkpoint_comparison/ (keys below are prefixed accordingly); the
# other side is the pre-existing headline data, untouched, in metrics_dir itself.
# auglabAug_v26_6_2's val000/val100 DualVal mirrors have genuinely different
# checkpoint_best.pth so both are kept as separate best rows; checkpoint_final.pth
# is byte-identical between them (verified via md5sum), so there is one final row.
title: "CHAOS T2spir — checkpoint_best vs checkpoint_final"
metrics_dir: "${METRICS_ROOT}/chaos_model/t2spir"
output_prefix: "best_vs_final_ckpt"
in_domain_contrast: t2spir

runs:
  - nnUNet_chaos_t2spir_baseline_20260620_111146  # baseline (best)
  - checkpoint_comparison/nnUNet_chaos_t2spir_baseline_20260620_111146  # baseline (final)
  - auglab_chaos_t2spir_synthseg_noEM_20260620_112515  # synthseg_noEM (best)
  - checkpoint_comparison/auglab_chaos_t2spir_synthseg_noEM_20260620_112515  # synthseg_noEM (final)
  - auglab_chaos_t2spir_synthseg_EM_20260620_112357  # synthseg_EM (best)
  - checkpoint_comparison/auglab_chaos_t2spir_synthseg_EM_20260620_112357  # synthseg_EM (final)
  - auglab_chaos_t2spir_auglab_default_20260620_112240  # auglab_default (best)
  - checkpoint_comparison/auglab_chaos_t2spir_auglab_default_20260620_112240  # auglab_default (final)
  - auglab_chaos_t2spir_srcsm_20260709_121945  # srcsm (best)
  - checkpoint_comparison/auglab_chaos_t2spir_srcsm_20260709_121945  # srcsm (final)
  - auglab_chaos_t2spir_auglabAug_v26_6_2_train050_val000_20260710_054202  # auglabAug_v26_6_2 val000 (best)
  - auglab_chaos_t2spir_auglabAug_v26_6_2_train050_val100_20260723_194053  # auglabAug_v26_6_2 val100 (best)
  - checkpoint_comparison/auglab_chaos_t2spir_auglabAug_v26_6_2_train050_20260723_194053  # auglabAug_v26_6_2 (final)
