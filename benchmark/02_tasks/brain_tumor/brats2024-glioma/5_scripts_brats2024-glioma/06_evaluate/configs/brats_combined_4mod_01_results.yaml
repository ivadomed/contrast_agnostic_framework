# BraTS 2024 Glioma — combined training modalities (t1n + t2w + t2f/FLAIR + t1c pooled — ALL FOUR BraTS contrasts as training modalities), cross-contrast.
# Consumed by benchmark/00_commun_scripts/00_03_evaluate/combined_modality_summary.py via
# 06_17_combined_modality_summary.sh. SIBLING of brats_combined_01_results.yaml (t1n + t2w only) and brats_combined_3mod_01_results.yaml (+t2f),
# which stays the headline until Paul decides otherwise — this one writes to its OWN output_dir
# (combined_contrasts_all4/) so it can never overwrite the headline files.
#
# Added 2026-09-21 after T1c became the fourth training modality (every BraTS contrast now trains; each model has exactly 3 held-out contrasts). Method keys/order identical
# to the 2-modality config. Pooling is the same as before: fold data tagged by modality, so each
# modality's 3 folds count as an equally weighted fold-mean (4 x 3 = 12 here). NOTE: `all` averages
# every tested contrast with equal weight per contrast, as in the 2-modality table — with four
# training modalities EVERY contrast is in-domain for exactly one pooled model and OOD for the other three.
# srcsm for t2f / t1c was still training at 2026-09-21: its row uses only the models with data until the
# srcsm predict+evals finish (then just re-run this config).
