# BraTS 2024 Glioma — combined training modalities (t1n + t2w + t2f/FLAIR pooled), cross-contrast.
# Consumed by benchmark/00_commun_scripts/00_03_evaluate/combined_modality_summary.py via
# 06_17_combined_modality_summary.sh. SIBLING of brats_combined_01_results.yaml (t1n + t2w only),
# which stays the headline until Paul decides otherwise — this one writes to its OWN output_dir
# (combined_contrasts_t1n_t2w_t2f/) so it can never overwrite the headline files.
#
# Added 2026-09-21 after FLAIR (t2f) became a third training modality. Method keys/order identical
# to the 2-modality config. Pooling is the same as before: fold data tagged by modality, so each
# modality's 3 folds count as an equally weighted fold-mean (3 x 3 = 9 here). NOTE: `all` averages
# every tested contrast with equal weight per contrast, as in the 2-modality table — with three
# training modalities, t1n / t2w / t2f are each in-domain for exactly one of the pooled models
# and OOD for the other two, while t1c is OOD for all three.
# srcsm for t2f was still training at 2026-09-21: its row uses only the t1n/t2w models until the
# t2f srcsm predict+eval finish (then just re-run this config).
title: "BraTS 2024 Glioma — combined training modalities (t1n + t2w + t2f), cross-contrast"
output_dir: "${METRICS_ROOT}/brats2024_glioma_model/combined_contrasts_t1n_t2w_t2f"
output_prefix: "01_results"
ref: auglabAug_v26_6_2_train050_val000
column_order: [t1c, t1n, t2f, t2w]

modalities:
