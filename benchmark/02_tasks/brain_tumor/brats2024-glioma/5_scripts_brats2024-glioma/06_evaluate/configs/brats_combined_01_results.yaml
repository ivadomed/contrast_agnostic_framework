# BraTS 2024 Glioma — combined training modalities (t1n + t2w + t2f/FLAIR + t1c pooled — ALL FOUR
# BraTS contrasts as training modalities), cross-contrast. Consumed by
# benchmark/00_commun_scripts/00_03_evaluate/combined_modality_summary.py via
# 06_17_combined_modality_summary.sh.
#
# CANONICAL as of 2026-09-27 (Paul's decision): this is now the one and only combined config for
# brats2024-glioma — the codebase expects all 4 modalities as the default. The older 2-modality
# (t1n+t2w only) and 3-modality (+t2f) configs/outputs that used to sit at this same path are
# superseded and archived at benchmark/03_archive/brats2024-glioma_superseded_combined_configs_20260927/
# — do not resurrect them as "the headline" without a deliberate decision to revert this.
#
# Added 2026-09-21 after T1c became the fourth training modality (every BraTS contrast now trains; each model has exactly 3 held-out contrasts). Method keys/order identical
# to the 2-modality config. Pooling is the same as before: fold data tagged by modality, so each
# modality's 3 folds count as an equally weighted fold-mean (4 x 3 = 12 here). NOTE: `all` averages
# every tested contrast with equal weight per contrast, as in the 2-modality table — with four
# training modalities EVERY contrast is in-domain for exactly one pooled model and OOD for the other three.
# srcsm for t1c was still training at 2026-09-27 (see 00_utils/t1c_runs.sh, group "srcsm", ~5 days):
# its row uses only the models with data until the srcsm predict+eval finishes (then just re-run
# this config — no other edits needed).
title: "BraTS 2024 Glioma — combined training modalities (t1n + t2w + t2f + t1c), cross-contrast"
output_dir: "${METRICS_ROOT}/brats2024_glioma_model/combined_contrasts"
output_prefix: "01_results"
ref: auglabAug_v26_6_2_train050_val000
column_order: [t1c, t1n, t2f, t2w]

modalities:
  - name: t1n
    metrics_dir: "${METRICS_ROOT}/brats2024_glioma_model/t1n"
    runs:
      baseline: brats2024-glioma_t1n_baseline_20260622_044535
      synthseg_noEM: brats2024-glioma_t1n_synthseg_noEM_20260622_044535
      synthseg_EM: brats2024-glioma_t1n_synthseg_EM_20260622_044535
      auglab_default: brats2024-glioma_t1n_auglab_default_20260622_044535
      srcsm: brats2024-glioma_t1n_srcsm_20260709_122015
      srcsm_srcmatch: brats2024-glioma_t1n_srcsm_20260709_122015_srcmatch   # SRCSM + its test-time source matching (2026-10-07)
      auglabAug_v26_6_2_train050_val000: brats2024-glioma_t1n_auglabAug_v26_6_2_train050_val000_20260710_040303
      auglabAug_v26_6_2_train050_val100: brats2024-glioma_t1n_auglabAug_v26_6_2_train050_val100_20260725_113540
  - name: t2w
    metrics_dir: "${METRICS_ROOT}/brats2024_glioma_model/t2w"
    runs:
      baseline: brats2024-glioma_t2w_baseline_20260620_125115
      synthseg_noEM: brats2024-glioma_t2w_synthseg_noEM_20260620_125442
      synthseg_EM: brats2024-glioma_t2w_synthseg_EM_20260620_125354
      auglab_default: brats2024-glioma_t2w_auglab_default_20260620_125306
      srcsm: brats2024-glioma_t2w_srcsm_20260709_122045
      srcsm_srcmatch: brats2024-glioma_t2w_srcsm_20260709_122045_srcmatch   # SRCSM + its test-time source matching (2026-10-07)
      auglabAug_v26_6_2_train050_val000: brats2024-glioma_t2w_auglabAug_v26_6_2_train050_val000_20260725_113540
      auglabAug_v26_6_2_train050_val100: brats2024-glioma_t2w_auglabAug_v26_6_2_train050_val100_20260725_113540
  - name: t2f
    metrics_dir: "${METRICS_ROOT}/brats2024_glioma_model/t2f"
    runs:
      baseline: brats2024-glioma_t2f_baseline_20260917_113412
      synthseg_noEM: brats2024-glioma_t2f_synthseg_noEM_20260917_113412
      synthseg_EM: brats2024-glioma_t2f_synthseg_EM_20260917_113412
      auglab_default: brats2024-glioma_t2f_auglab_default_20260917_113412
      srcsm: brats2024-glioma_t2f_srcsm_20260917_094019
      srcsm_srcmatch: brats2024-glioma_t2f_srcsm_20260917_094019_srcmatch   # SRCSM + its test-time source matching (2026-10-07)
      auglabAug_v26_6_2_train050_val000: brats2024-glioma_t2f_auglabAug_v26_6_2_train050_val000_20260917_113412
      auglabAug_v26_6_2_train050_val100: brats2024-glioma_t2f_auglabAug_v26_6_2_train050_val100_20260917_113412
  - name: t1c
    metrics_dir: "${METRICS_ROOT}/brats2024_glioma_model/t1c"
    runs:
      baseline: brats2024-glioma_t1c_baseline_20260921_140000
      synthseg_noEM: brats2024-glioma_t1c_synthseg_noEM_20260921_140000
      synthseg_EM: brats2024-glioma_t1c_synthseg_EM_20260921_140000
      auglab_default: brats2024-glioma_t1c_auglab_default_20260921_140000
      srcsm: brats2024-glioma_t1c_srcsm_20260921_140000
      srcsm_srcmatch: brats2024-glioma_t1c_srcsm_20260921_140000_srcmatch   # SRCSM + its test-time source matching (2026-10-07)
      auglabAug_v26_6_2_train050_val000: brats2024-glioma_t1c_auglabAug_v26_6_2_train050_val000_20260921_140000
      auglabAug_v26_6_2_train050_val100: brats2024-glioma_t1c_auglabAug_v26_6_2_train050_val100_20260921_140000
