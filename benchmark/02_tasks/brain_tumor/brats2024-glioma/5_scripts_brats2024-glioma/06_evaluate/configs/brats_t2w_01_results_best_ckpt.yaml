# Generated as part of the checkpoint_best vs checkpoint_final comparison sweep.
# Real data for the side that wasn't this dataset's historical on-disk default
# lives under metrics_dir/checkpoint_comparison/ (keys below are prefixed accordingly); the
# other side is the pre-existing headline data, untouched, in metrics_dir itself.
# auglabAug_v26_6_2's val000/val100 DualVal mirrors have genuinely different
# checkpoint_best.pth so both are kept as separate best rows; checkpoint_final.pth
# is byte-identical between them (verified via md5sum), so there is one final row.
title: "BraTS 2024 Glioma T2w — checkpoint_best"
metrics_dir: "${METRICS_ROOT}/brats2024_glioma_model/t2w"
output_prefix: "best_ckpt"
in_domain_contrast: t2w

runs:
  - nnUNet_brats2024-glioma_t2w_baseline_20260620_125115  # baseline
  - auglab_brats2024-glioma_t2w_synthseg_noEM_20260620_125442  # synthseg_noEM
  - auglab_brats2024-glioma_t2w_synthseg_EM_20260620_125354  # synthseg_EM
  - auglab_brats2024-glioma_t2w_auglab_default_20260620_125306  # auglab_default
  - auglab_brats2024-glioma_t2w_srcsm_20260709_122045  # srcsm
  - auglab_brats2024-glioma_t2w_auglabAug_v26_6_2_train050_val000_20260725_113540  # auglabAug_v26_6_2 val000
  - auglab_brats2024-glioma_t2w_auglabAug_v26_6_2_train050_val100_20260725_113540  # auglabAug_v26_6_2 val100
