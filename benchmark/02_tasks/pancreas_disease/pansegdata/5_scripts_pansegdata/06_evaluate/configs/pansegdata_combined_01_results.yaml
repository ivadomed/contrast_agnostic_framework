# 2026-10-07: srcsm = SRC + test-time source matching (as published): run id is <run>_srcmatch; the plain SRC metrics stay next to it (plain run: pansegdata_{t1wce_srcsm_20261004_214055,t2w_srcsm_20261005_201341}).
# pansegdata -- all training contrasts pooled, cross-contrast (combined_modality_summary.py).
# Generated by write_configs_from_roster.py from roster_run_ids.tsv, then HAND-EDITED 2026-10-07 to add the external cohort `totalsegmri-pancreas` (TotalSegmentator MRI v2) as extra
# test columns (`sources:` + `contrast_groups`, same mechanism as ispy2). Do NOT rerun 06_05_write_configs.sh --force without re-adding it. Cross-DATASET evidence:
#   totalseg_t2like (n=12) has the same contrast as t2w -> pooled into the t2w column; totalseg_t1gre (n=97; T1 GRE, contrast phase unknown) is NOT assumed equal to t1wce -> its own column.
# 2026-10-07 (2): + msd-pancreas (MSD Task07 pancreas CT, n=280, ground truth = pancreas+cancer union) as prefix `msd_`: CT is a NEW modality, held out for BOTH training directions -> own column `msd_ct`.
#   Pending: the amos-pancreas companion (item mixed_t1) is added by the session that owns it.
title: "pansegdata -- combined training contrasts (t1wce + t2w), cross-contrast"
output_dir: "${PROJECT_ROOT}/benchmark/02_tasks/pancreas_disease/pansegdata/8_results_pansegdata/02_metrics/pansegdata_model/combined_contrasts"
output_prefix: "01_results"
ref: auglabAug_v26_6_2_train050_val000
column_order: [t1wce, t2w, totalseg_t1gre, msd_ct]

contrast_groups:
  t1wce: t1wce
  t2w: [t2w, totalseg_t2like]
  totalseg_t1gre: totalseg_t1gre
  msd_ct: msd_ct

modalities:
  - name: t1wce
    sources:
      - metrics_dir: "${PROJECT_ROOT}/benchmark/02_tasks/pancreas_disease/pansegdata/8_results_pansegdata/02_metrics/pansegdata_model/t1wce"
      - metrics_dir: "${PROJECT_ROOT}/benchmark/02_tasks/pancreas_disease/totalsegmri-pancreas/8_results_totalsegmri-pancreas/02_metrics/pansegdata_model/t1wce/t1gre"
        column_prefix: "totalseg_"
      - metrics_dir: "${PROJECT_ROOT}/benchmark/02_tasks/pancreas_disease/totalsegmri-pancreas/8_results_totalsegmri-pancreas/02_metrics/pansegdata_model/t1wce/t2like"
        column_prefix: "totalseg_"
      - metrics_dir: "${PROJECT_ROOT}/benchmark/02_tasks/pancreas_disease/msd-pancreas/8_results_msd-pancreas/02_metrics/pansegdata_model/t1wce/ct"
        column_prefix: "msd_"
    runs:
      baseline: pansegdata_t1wce_baseline_20261004_213842
      synthseg_noEM: pansegdata_t1wce_synthseg_noEM_20261004_213948
      synthseg_EM: pansegdata_t1wce_synthseg_EM_20261004_214021
      auglab_default: pansegdata_t1wce_auglab_default_20261004_213915
      srcsm: pansegdata_t1wce_srcsm_20261004_214055_srcmatch
      auglabAug_v26_6_2_train050_val000: pansegdata_t1wce_auglabAug_v26_6_2_train050_val000_20261005_201307
      auglabAug_v26_6_2_train050_val100: pansegdata_t1wce_auglabAug_v26_6_2_train050_val100_20261005_201307
  - name: t2w
    sources:
      - metrics_dir: "${PROJECT_ROOT}/benchmark/02_tasks/pancreas_disease/pansegdata/8_results_pansegdata/02_metrics/pansegdata_model/t2w"
      - metrics_dir: "${PROJECT_ROOT}/benchmark/02_tasks/pancreas_disease/totalsegmri-pancreas/8_results_totalsegmri-pancreas/02_metrics/pansegdata_model/t2w/t1gre"
        column_prefix: "totalseg_"
      - metrics_dir: "${PROJECT_ROOT}/benchmark/02_tasks/pancreas_disease/totalsegmri-pancreas/8_results_totalsegmri-pancreas/02_metrics/pansegdata_model/t2w/t2like"
        column_prefix: "totalseg_"
      - metrics_dir: "${PROJECT_ROOT}/benchmark/02_tasks/pancreas_disease/msd-pancreas/8_results_msd-pancreas/02_metrics/pansegdata_model/t2w/ct"
        column_prefix: "msd_"
    runs:
      baseline: pansegdata_t2w_baseline_20261004_214413
      synthseg_noEM: pansegdata_t2w_synthseg_noEM_20261004_214519
      synthseg_EM: pansegdata_t2w_synthseg_EM_20261004_214552
      auglab_default: pansegdata_t2w_auglab_default_20261004_214446
      srcsm: pansegdata_t2w_srcsm_20261005_201341_srcmatch
      auglabAug_v26_6_2_train050_val000: pansegdata_t2w_auglabAug_v26_6_2_train050_val000_20261005_201414
