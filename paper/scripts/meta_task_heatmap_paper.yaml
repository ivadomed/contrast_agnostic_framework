# PAPER-SCOPED copy of scripts/evaluate/meta_task_heatmap.yaml, restricted to
# the 4 tasks this paper reports (brats2024-glioma, chaos, on-harmony,
# open-ms). The shared config also lists a 5th task, healthy-spine-tum,
# added by a separate, unrelated workstream in this repo (2026-08-29) --
# correct for that broader project, out of scope for this paper. Rather than
# edit the shared config (which that other workstream depends on) or let
# that task silently drift into the paper's headline table, this file pins
# the paper's own task list, output to a paper-local dir so it never
# collides with datasets/01_commun_results/meta_task_heatmap_summary.md (now
# serving the broader, multi-task project).
#
# atlas-liver-hcc (liver tumour, HCC) REMOVED 2026-09-02: the whole
# atlas-liver-hcc extension (training set + its two eval-only companions
# lld-mmri-hcc/lld-mmri-malignant + liverhccseg) is excluded from the paper
# entirely -- see CLAUDE.md "Atlas-Liver-HCC exclusion (2026-09-02)" for the
# full rationale (LLD-MMRI's redistribution terms block the git-annex
# reproducibility path; the causal-ablation ladder's OOD contrast pool
# turned out to hinge on an ambiguous contrast -- Dixon out-of-phase reads as
# appearance-adjacent to ATLAS's own fat-suppressed CE-T1w training data,
# and the ladder's sign flips depending on whether it's included; and
# ATLAS's own training cohort is itself an uncontrolled mix of CE-T1w
# phases, undermining a clean in-domain/out-of-domain split). The dataset
# directories moved to datasets/03_archive/. It was briefly a 5th task here
# (added 2026-08-29, single training modality CE-T1w, no second in-house
# contrast to cross-evaluate -- see the pre-2026-09-02 git history of this
# file for that config if it's ever needed for reference).
#
# Otherwise identical to the shared config: same ref, same per-task configs.
title: "Cross-dataset — task-level heatmap (7-method suite, paper's 4 tasks)"
output_dir: "${PROJECT_ROOT}/paper/generated_results"
output_prefix: "meta_task_heatmap_paper"
ref: auglabAug_v26_6_2_train050_val000

tasks:
  - name: brats2024-glioma
    dataset: brats2024-glioma
    config: "${PROJECT_ROOT}/datasets/brats2024-glioma/5_scripts_brats2024-glioma/06_evaluate/configs/brats_combined_01_results.yaml"
  - name: chaos
    dataset: chaos
    config: "${PROJECT_ROOT}/datasets/chaos/5_scripts_chaos/06_evaluate/configs/chaos_combined_01_results.yaml"
  - name: on-harmony
    dataset: on-harmony
    config: "${PROJECT_ROOT}/datasets/on-harmony/5_scripts_on-harmony/06_evaluate/configs/on-harmony_combined_01_results.yaml"
  - name: open-ms
    dataset: open-ms
    config: "${PROJECT_ROOT}/datasets/open-ms/5_scripts_open-ms/06_evaluate/configs/open-ms_combined_01_results.yaml"
